services:
  harness-dashboard:
    build: .
    environment:
      - AEGIS_TELEMETRY_TOKEN=${AEGIS_TELEMETRY_TOKEN:-}
    ports:
      - "8787:8787"
    volumes:
      - ./:/workspace
    working_dir: /workspace
    command: >
      sh -c "[ -f .harness/config.yaml ] || harness init --name aegis-harness --asset-code HARNESS-001;
      harness dashboard --host 0.0.0.0 --port 8787"
