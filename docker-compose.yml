services:
  mock-aegis:
    build: .
    command: ["uvicorn", "harness.telemetry.mock_aegis:create_mock_aegis_app", "--factory", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "3000:3000"

  harness-dashboard:
    build: .
    depends_on:
      - mock-aegis
    environment:
      - AEGIS_TELEMETRY_TOKEN=${AEGIS_TELEMETRY_TOKEN:-aegis_test_token_1234567890abcdef}
    ports:
      - "8787:8787"
    volumes:
      - ./:/workspace
    working_dir: /workspace
    command: >
      sh -c "[ -f .harness/config.yaml ] || harness init --name aegis-harness --asset-code HARNESS-001;
      harness dashboard --host 0.0.0.0 --port 8787"
