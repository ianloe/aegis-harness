# Sample Policy Profile: Standard Enterprise
version: "1.0.0"
default_risk_tier: medium
require_signed_commits: true
restricted_paths:
  - ".github/workflows/**"
  - ".gitlab-ci.yml"
  - "infra/**"
  - "terraform/**"
  - ".env*"
  - "*.pem"
  - "*.key"
  - ".harness/config.yaml"
allowed_tools:
  - read_file
  - write_file
  - search
  - pytest
  - ruff
  - git
allowed_commands:
  - pytest
  - ruff
  - mypy
  - git status
  - git diff
  - python -m pytest
risk_tiers:
  low:
    required_approvals: 0
    require_distinct_approver: false
    max_diff_lines: 250
    required_checks: ["secrets", "sast", "tests", "diff"]
    require_governance_office: false
  medium:
    required_approvals: 1
    require_distinct_approver: true
    max_diff_lines: 600
    required_checks: ["secrets", "sast", "deps", "tests", "diff"]
    require_governance_office: false
  high:
    required_approvals: 2
    require_distinct_approver: true
    max_diff_lines: 1000
    required_checks: ["secrets", "sast", "deps", "tests", "diff"]
    require_governance_office: true
